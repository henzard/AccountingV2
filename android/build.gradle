// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// Previously pinned to 35 (Android 15) because SDK 36's 16 KB native page
// alignment SIGSEGV'd expo-sqlite's prebuilt .so on the first sqlite3 JSI
// call. Fixed upstream in Expo SDK 53 (expo/expo#37446); this project is on
// SDK 55, so the pin is no longer needed. Google Play requires targeting 36+
// from 2026-08-31.
ext {
    targetSdkVersion = 36
}
