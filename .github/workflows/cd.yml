name: CD — Google Play Internal Testing

on:
  push:
    branches: [master]

# One publish at a time. Two overlapping runs both open a Google Play edit and
# the second commit fails with "A change was made to the application outside of
# this Edit" (seen when two PRs merged minutes apart). Queue instead of cancel:
# a cancelled run could be killed mid-upload.
concurrency:
  group: cd-google-play
  cancel-in-progress: false

jobs:
  # ci-gate mirrors ci.yml's `check` job line-for-line. It is duplicated (rather
  # than depended on via workflow_run) so this workflow's own run status is the
  # single source of truth for whether the train passed — see db-gate/e2e-gate
  # below and the "CD-races-CI" note on build-and-publish.
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --ext .ts,.tsx --max-warnings 0

      - name: Jest (app, with coverage)
        run: npx jest --selectProjects app --coverage

      - name: Jest (realsql tier)
        run: npx jest --selectProjects realsql

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.x'

      - name: Run Deno tests
        run: deno test --node-modules-dir=none --allow-net --allow-env --allow-read supabase/functions/

  # db-gate mirrors ci.yml's `db` job: replays the full migration chain against
  # a fresh local Postgres, runs the pgTAP suite, and runs the two-device
  # convergence tier against real sync_push/sync_pull. Without this, CD could
  # publish a build whose oplog sync protocol is broken at the DB layer even
  # though ci-gate (app-level unit/coverage tests) passed.
  db-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          # Pinned: `latest` resolves through the GitHub API, which rate-limits and
          # flaked this job; a release gate should not float its toolchain either.
          version: 2.117.0

      - name: Boot local Supabase stack
        run: supabase start

      - name: Replay full migration chain
        run: supabase db reset

      - name: Run pgTAP suite
        run: supabase test db

      - name: Run two-device convergence tier (real sync_push/sync_pull)
        run: npx jest --selectProjects twodevice
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

  # e2e-gate builds the `e2e` build type (a release-shaped, non-debuggable,
  # minified variant — see android/app/build.gradle) against a fresh local
  # Supabase stack and runs the tier-4 authenticated Detox journey (sign up →
  # onboard → create envelope → add transaction → verify).
  #
  # HISTORY (deep-review OPS-1/OPS-5): this job failed 11/11 for over two
  # months with "app has unexpectedly disconnected from Detox server", but
  # every one of those runs was reported GREEN, because
  # reactivecircus/android-emulator-runner executes each `script:` line in
  # its own `sh -c` — `DETOX_EXIT=$?`/`exit $DETOX_EXIT` on separate lines
  # meant the final `exit` always ran with no captured status (bare `exit` =
  # 0), and `LOGCAT_PID=$!` was lost the same way, so the logcat dump was
  # always empty and the root cause stayed invisible. Both bugs were fixed by
  # moving the whole thing into scripts/ci/run-detox.sh (one shell, one
  # `script:` line), which made this job go correctly red — but the actual
  # Detox connection failure was still unresolved at that point.
  #
  # NEW HYPOTHESIS (2026-09-20): the job was building+testing the `debug`
  # build type. This Expo app sets `debuggableVariants = []`
  # (android/app/build.gradle react{} block) — comment there says it's
  # required so debug embeds the JS bundle for CI, since Metro never runs
  # here — but the app also depends on `expo-dev-client`, which makes a
  # debug APK boot straight into the dev-launcher UI instead of the app
  # regardless of whether a bundle is embedded, so Detox connects to a
  # screen with none of the app's testIDs and eventually reports the app as
  # disconnected. This job now builds/tests the dedicated `e2e` build type
  # instead (release-shaped: minified, non-debuggable, no dev-launcher
  # entry), with a scoped cleartext allowance for 10.0.2.2/localhost only
  # (android/app/src/e2e/ manifest + network security config) so it can
  # still reach the local Supabase stack. What the next run will actually
  # show: whether the app now boots past the dev-launcher and Detox gets a
  # connection at all (evidence the hypothesis was right), vs. some other
  # failure now surfacing once that layer is fixed (e.g. R8 stripping
  # something Detox/the app needs — the Detox proguard rules are already
  # applied, but this is unverified until a real CI run). Either way the now
  # non-empty, unfiltered logcat artifact should make the actual failure
  # visible for the first time. It stays `continue-on-error: true` and out
  # of build-and-publish's `needs:` below until a run is observed green.
  #
  # To restore this as a hard release gate: get a genuinely green run (all
  # journeys passing) with real logcat evidence attached, then remove
  # `continue-on-error` here and add `e2e-gate` back to build-and-publish's
  # `needs:`.
  e2e-gate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: ci-gate
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm

      - name: Install JS dependencies
        run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          # Pinned: `latest` resolves through the GitHub API, which rate-limits and
          # flaked this job; a release gate should not float its toolchain either.
          version: 2.117.0

      - name: Boot local Supabase stack (backs the tier-4 authenticated journey)
        run: supabase start

      - name: Replay full migration chain
        run: supabase db reset

      - name: Capture local Supabase connection details
        id: supa
        run: |
          supabase status -o env > /tmp/supabase-status.env
          KEY=$(grep '^PUBLISHABLE_KEY=' /tmp/supabase-status.env | cut -d= -f2- | tr -d '"')
          echo "anon_key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Install Detox CLI
        run: npm install -g detox-cli

      - name: Start ADB server
        run: |
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          /usr/local/lib/android/sdk/platform-tools/adb start-server

      - name: Build e2e APK + test APK
        run: detox build --configuration android.emu.e2e
        env:
          # This is the RELEASE-shaped `e2e` build type (android/app/build.gradle):
          # unlike debug, it bundles JS at build time, so these values must be
          # present here, not just at runtime. Points at the local Supabase
          # stack (10.0.2.2 = emulator's alias for the runner's host loopback),
          # never at production — the `e2e` build type's scoped network
          # security config (android/app/src/e2e/) only allows cleartext to
          # that address and localhost.
          EXPO_PUBLIC_SUPABASE_URL: http://10.0.2.2:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supa.outputs.anon_key }}

      - name: Run Detox tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          avd-name: Pixel_API_34
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash scripts/ci/run-detox.sh android.emu.e2e /tmp/logcat-e2e-gate.txt

      - name: Upload e2e-gate logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-gate-logcat
          path: /tmp/logcat-e2e-gate.txt
          if-no-files-found: warn

  # release-smoke (deep-review OPS-2): installs and launches the actual
  # MINIFIED release APK on an emulator and fails if it crashes — the check
  # that would have caught 1.1.127 (R8 broke expo-modules-core Record
  # conversion; every user hit a SIGABRT on launch). No path filter here
  # (unlike ci.yml's release-smoke): this only runs on pushes to master that
  # already passed ci-gate/db-gate, so there's no "must run on every PR"
  # tension to work around.
  release-smoke:
    runs-on: ubuntu-latest
    needs: ci-gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install JS dependencies
        run: npm ci

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
        env:
          # Dummy-safe: this build only needs to launch far enough to prove
          # R8 didn't break module init; it never talks to Supabase. Signing
          # falls back to debug.keystore (android/app/build.gradle) when the
          # KEYSTORE_* secrets used by build-and-publish's real release build
          # are unset.
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_smoke_dummy_key

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm

      - name: Release-launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          avd-name: Pixel_API_34
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash scripts/ci/release-smoke.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release-smoke logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-logcat
          path: logcat-release-smoke.txt
          if-no-files-found: ignore

  # CD-races-CI fix (deep-review finding): build-and-publish previously only
  # depended on ci-gate, so it could reach Play before the DB-layer tier had a
  # chance to fail. It now hard-depends on ci-gate + db-gate + release-smoke
  # (deep-review OPS-2, the real launch gate) — e2e-gate is intentionally
  # excluded; see the DECISION comment on the e2e-gate job above.
  build-and-publish:
    needs: [ci-gate, db-gate, release-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Compute versionName
        id: vname
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "name=1.1.${{ github.run_number }}+${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ steps.vname.outputs.name }} --no-daemon
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          # EXPO_PUBLIC_* values are bundled into the client by design (protected by RLS).
          # Without these, app.config.ts extra.supabaseUrl/supabaseAnonKey are undefined
          # and supabaseClient.ts throws at module eval → app crashes on launch.
          EXPO_PUBLIC_SUPABASE_URL: https://qmfsobqpnogefvzltwyj.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Rk3QUD3vehZPVPuoWx-RRg_k5oM47l5

      - name: Check Firebase secrets
        id: firebase_check
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$SA_JSON" ]; then
            echo "has_sa=true" >> $GITHUB_OUTPUT
          else
            echo "has_sa=false" >> $GITHUB_OUTPUT
          fi
          if [ -n "$SA_JSON" ] && [ -n "$PROJECT_ID" ]; then
            echo "has_both=true" >> $GITHUB_OUTPUT
          else
            echo "has_both=false" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        if: steps.firebase_check.outputs.has_sa == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up gcloud CLI
        if: steps.firebase_check.outputs.has_sa == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Build release APK for Firebase Test Lab
        if: steps.firebase_check.outputs.has_sa == 'true'
        working-directory: android
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ steps.vname.outputs.name }} --no-daemon
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EXPO_PUBLIC_SUPABASE_URL: https://qmfsobqpnogefvzltwyj.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Rk3QUD3vehZPVPuoWx-RRg_k5oM47l5

      - name: Firebase Test Lab — Robo smoke test
        if: steps.firebase_check.outputs.has_both == 'true'
        # DECISION: continue-on-error kept because toolresults.googleapis.com
        # (Cloud Tool Results API) is currently DISABLED on this Firebase/GCP
        # project — verified in GCP Console → APIs & Services. Robo results
        # cannot be written without it, so this step fails every run
        # regardless of app health. Enable the API in the console, then
        # remove continue-on-error to make this a hard gate.
        continue-on-error: true
        run: |
          gcloud firebase test android run \
            --type robo \
            --app android/app/build/outputs/apk/release/app-release.apk \
            --device model=oriole,version=33,locale=en,orientation=portrait \
            --timeout 90s \
            --project ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Upload Crashlytics mapping file artifact
        # The Crashlytics Gradle plugin (android/build.gradle) already runs
        # :app:uploadCrashlyticsMappingFileRelease automatically as part of
        # the bundleRelease build above (verified in the CD run log) — no
        # separate upload step is needed. This just keeps a copy of the
        # mapping file as a build artifact for manual inspection/debugging.
        uses: actions/upload-artifact@v4
        with:
          name: mapping-txt
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Upload to Play Store — Internal Testing
        # Pinned to v1 tag commit SHA for supply-chain security (C11)
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.henza.accountingv2
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          inAppUpdatePriority: 2
