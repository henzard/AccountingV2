name: CD — Google Play Internal Testing

on:
  push:
    branches: [master]

jobs:
  # ci-gate mirrors ci.yml's `check` job line-for-line. It is duplicated (rather
  # than depended on via workflow_run) so this workflow's own run status is the
  # single source of truth for whether the train passed — see db-gate/e2e-gate
  # below and the "CD-races-CI" note on build-and-publish.
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --ext .ts,.tsx --max-warnings 0

      - name: Jest (app, with coverage)
        run: npx jest --selectProjects app --coverage

      - name: Jest (realsql tier)
        run: npx jest --selectProjects realsql

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: 'v1.x'

      - name: Run Deno tests
        run: deno test --allow-net --allow-env --allow-read supabase/functions/

  # db-gate mirrors ci.yml's `db` job: replays the full migration chain against
  # a fresh local Postgres, runs the pgTAP suite, and runs the two-device
  # convergence tier against real sync_push/sync_pull. Without this, CD could
  # publish a build whose oplog sync protocol is broken at the DB layer even
  # though ci-gate (app-level unit/coverage tests) passed.
  db-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Boot local Supabase stack
        run: supabase start

      - name: Replay full migration chain
        run: supabase db reset

      - name: Run pgTAP suite
        run: supabase test db

      - name: Run two-device convergence tier (real sync_push/sync_pull)
        run: npx jest --selectProjects twodevice
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

  # e2e-gate mirrors ci.yml's `e2e-android` job: builds a debug APK against a
  # fresh local Supabase stack and runs the tier-4 authenticated Detox journey
  # (sign up → onboard → create envelope → add transaction → verify).
  #
  # DECISION: this is gated hard (build-and-publish needs it) per the "Done
  # means: tier-4 authenticated e2e gates CD" requirement. It roughly doubles
  # CD wall-clock time and inherits Detox's known flakiness profile. If this
  # proves too flaky/slow in practice, the documented fallback is to drop
  # `e2e-gate` from build-and-publish's `needs:` below — ci-gate + db-gate
  # (the full unit/integration train) remain the non-negotiable minimum gate.
  e2e-gate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: ci-gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm

      - name: Install JS dependencies
        run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Boot local Supabase stack (backs the tier-4 authenticated journey)
        run: supabase start

      - name: Replay full migration chain
        run: supabase db reset

      - name: Capture local Supabase connection details
        id: supa
        run: |
          supabase status -o env > /tmp/supabase-status.env
          KEY=$(grep '^PUBLISHABLE_KEY=' /tmp/supabase-status.env | cut -d= -f2- | tr -d '"')
          echo "anon_key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Install Detox CLI
        run: npm install -g detox-cli

      - name: Start ADB server
        run: |
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          /usr/local/lib/android/sdk/platform-tools/adb start-server

      - name: Build debug APK
        run: detox build --configuration android.emu.debug
        env:
          # See DECISION note on ci.yml's e2e-android job: points at the local
          # Supabase stack (10.0.2.2 = emulator's alias for the runner's host
          # loopback), never at production.
          EXPO_PUBLIC_SUPABASE_URL: http://10.0.2.2:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supa.outputs.anon_key }}

      - name: Run Detox tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          avd-name: Pixel_API_34
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            adb shell input keyevent 82
            adb logcat -c
            adb logcat AndroidRuntime:E ReactNativeJS:V com.henza.accountingv2:V detox:V *:S >> /tmp/logcat.txt 2>&1 &
            LOGCAT_PID=$!
            detox test --configuration android.emu.debug --headless --loglevel info 2>&1; DETOX_EXIT=$?
            kill $LOGCAT_PID 2>/dev/null || true
            echo "===== LOGCAT ====="
            cat /tmp/logcat.txt || true
            echo "===== END LOGCAT ====="
            exit $DETOX_EXIT

  # CD-races-CI fix (deep-review finding): build-and-publish previously only
  # depended on ci-gate, so it could reach Play before the DB-layer and e2e
  # tiers had a chance to fail. It now hard-depends on the full train.
  build-and-publish:
    needs: [ci-gate, db-gate, e2e-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Compute versionName
        id: vname
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "name=1.1.${{ github.run_number }}+${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ steps.vname.outputs.name }} --no-daemon
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          # EXPO_PUBLIC_* values are bundled into the client by design (protected by RLS).
          # Without these, app.config.ts extra.supabaseUrl/supabaseAnonKey are undefined
          # and supabaseClient.ts throws at module eval → app crashes on launch.
          EXPO_PUBLIC_SUPABASE_URL: https://qmfsobqpnogefvzltwyj.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Rk3QUD3vehZPVPuoWx-RRg_k5oM47l5

      - name: Check Firebase secrets
        id: firebase_check
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$SA_JSON" ]; then
            echo "has_sa=true" >> $GITHUB_OUTPUT
          else
            echo "has_sa=false" >> $GITHUB_OUTPUT
          fi
          if [ -n "$SA_JSON" ] && [ -n "$PROJECT_ID" ]; then
            echo "has_both=true" >> $GITHUB_OUTPUT
          else
            echo "has_both=false" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        if: steps.firebase_check.outputs.has_sa == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up gcloud CLI
        if: steps.firebase_check.outputs.has_sa == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Build release APK for Firebase Test Lab
        if: steps.firebase_check.outputs.has_sa == 'true'
        working-directory: android
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ steps.vname.outputs.name }} --no-daemon
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EXPO_PUBLIC_SUPABASE_URL: https://qmfsobqpnogefvzltwyj.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Rk3QUD3vehZPVPuoWx-RRg_k5oM47l5

      - name: Firebase Test Lab — Robo smoke test
        if: steps.firebase_check.outputs.has_both == 'true'
        # DECISION: continue-on-error kept until toolresults.googleapis.com is confirmed
        # enabled in GCP Console → APIs & Services → Cloud Tool Results API.
        # Once enabled, remove continue-on-error to make this a hard gate.
        continue-on-error: true
        run: |
          gcloud firebase test android run \
            --type robo \
            --app android/app/build/outputs/apk/release/app-release.apk \
            --device model=oriole,version=33,locale=en,orientation=portrait \
            --timeout 90s \
            --project ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Upload Crashlytics mapping file
        # uploadCrashlyticsSymbolFileRelease only exists when NDK/native code is present.
        # uploadCrashlyticsMappingFileRelease only exists when minification is enabled.
        # Neither applies to this project, so skip entirely for now.
        # Re-enable if NDK or R8 minification is added in a future phase.
        if: false
        working-directory: android
        run: |
          ./gradlew uploadCrashlyticsMappingFileRelease

      - name: Upload to Play Store — Internal Testing
        # Pinned to v1 tag commit SHA for supply-chain security (C11)
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.henza.accountingv2
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          inAppUpdatePriority: 2
