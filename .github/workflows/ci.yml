name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --ext .ts,.tsx --max-warnings 0

      - name: Jest (app, with coverage)
        run: npx jest --selectProjects app --coverage

      - name: Jest (realsql tier)
        run: npx jest --selectProjects realsql

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.x'

      - name: Run Deno tests
        run: deno test --node-modules-dir=none --allow-net --allow-env --allow-read supabase/functions/

  db:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Boot local Supabase stack
        run: supabase start

      - name: Replay full migration chain
        run: supabase db reset

      - name: Run pgTAP suite
        run: supabase test db

      - name: Run two-device convergence tier (real sync_push/sync_pull)
        run: npx jest --selectProjects twodevice
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

  e2e-android:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm

      - name: Install JS dependencies
        run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Boot local Supabase stack (backs the tier-4 authenticated journey)
        run: supabase start

      - name: Replay full migration chain
        run: supabase db reset

      - name: Capture local Supabase connection details
        id: supa
        run: |
          supabase status -o env > /tmp/supabase-status.env
          # PUBLISHABLE_KEY is the local anon-equivalent key (sb_publishable_* format,
          # matching the client the app actually ships with). 10.0.2.2 is the Android
          # emulator's alias for the host loopback interface — the emulator cannot
          # reach 127.0.0.1 on the runner directly.
          KEY=$(grep '^PUBLISHABLE_KEY=' /tmp/supabase-status.env | cut -d= -f2- | tr -d '"')
          echo "anon_key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Install Detox CLI
        run: npm install -g detox-cli

      - name: Start ADB server
        run: |
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          /usr/local/lib/android/sdk/platform-tools/adb start-server

      - name: Build debug APK
        run: detox build --configuration android.emu.debug
        env:
          # EXPO_PUBLIC_* are bundled into the JS bundle at build time.
          # Without these, supabaseClient.ts throws at module eval → app crashes on launch.
          #
          # DECISION: the debug/Detox build points at the local Supabase stack
          # (not the deployed remote project) so the tier-4 authenticated journey
          # (e2e/journeys/authenticatedJourney.e2e.ts) can sign up a throwaway user,
          # exercise onboarding/envelopes/transactions, and be torn down with the
          # runner — it never touches production data.
          EXPO_PUBLIC_SUPABASE_URL: http://10.0.2.2:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supa.outputs.anon_key }}

      - name: Run Detox tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          avd-name: Pixel_API_34
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            adb shell input keyevent 82
            adb logcat -c
            adb logcat AndroidRuntime:E ReactNativeJS:V com.henza.accountingv2:V detox:V *:S >> /tmp/logcat.txt 2>&1 &
            LOGCAT_PID=$!
            detox test --configuration android.emu.debug --headless --loglevel info 2>&1; DETOX_EXIT=$?
            kill $LOGCAT_PID 2>/dev/null || true
            echo "===== LOGCAT ====="
            cat /tmp/logcat.txt || true
            echo "===== END LOGCAT ====="
            exit $DETOX_EXIT
