name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --ext .ts,.tsx --max-warnings 0

      - name: Jest (app, with coverage)
        run: npx jest --selectProjects app --coverage

      - name: Jest (realsql tier)
        run: npx jest --selectProjects realsql

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.x'

      - name: Run Deno tests
        run: deno test --node-modules-dir=none --allow-net --allow-env --allow-read supabase/functions/

  db:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          # Pinned: `latest` resolves through the GitHub API, which rate-limits and
          # flaked this job; a release gate should not float its toolchain either.
          version: 2.117.0

      - name: Boot local Supabase stack
        run: supabase start

      - name: Replay full migration chain
        run: supabase db reset

      - name: Run pgTAP suite
        run: supabase test db

      - name: Run two-device convergence tier (real sync_push/sync_pull)
        run: npx jest --selectProjects twodevice
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

  # release-smoke: gates PRs that touch anything that can affect the RELEASE
  # (minified) build on it actually launching. See scripts/ci/release-smoke.sh
  # for why this exists (1.1.127 shipped a release build that crashed on
  # launch for every user; nothing had ever installed/launched a minified
  # release build before publishing it). Runs on pull_request only — cd.yml
  # runs the same gate on master before build-and-publish.
  #
  # ci.yml has other jobs that must run on every PR regardless of which files
  # changed, so the path filter can't be a workflow-level `on.pull_request.paths`
  # (that would skip the whole workflow, including `check`/`db`). Instead the
  # filter is a `git diff --name-only` step whose output gates every
  # subsequent step in this job — steps still run (job shows green/skipped
  # per-step) but do nothing on PRs that can't affect the release build.
  release-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect release-relevant changes
        id: changes
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | grep -qE '^(android/|package\.json$|package-lock\.json$|app\.config\.ts$|patches/|scripts/ci/|\.github/workflows/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        if: steps.changes.outputs.relevant == 'true'
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install JS dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci

      - name: Build release APK
        if: steps.changes.outputs.relevant == 'true'
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
        env:
          # Dummy-safe: this build only needs to launch far enough to prove
          # R8 didn't break module init (see release-smoke.sh); it never talks
          # to Supabase. Signing falls back to debug.keystore (android/app/build.gradle)
          # when the KEYSTORE_* secrets used by cd.yml's real release build are unset.
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_smoke_dummy_key

      - name: Enable KVM for hardware-accelerated emulation
        if: steps.changes.outputs.relevant == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm

      - name: Release-launch smoke test
        if: steps.changes.outputs.relevant == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          avd-name: Pixel_API_34
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash scripts/ci/release-smoke.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release-smoke logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-logcat
          path: logcat-release-smoke.txt
          if-no-files-found: ignore
