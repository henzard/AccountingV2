name: Web E2E

# Builds the Expo web bundle and runs the Playwright end-to-end suite against
# it in headless Chromium. Proves the app boots and the auth surface works in a
# real browser on every push. See e2e-web/ and docs/web-support.md.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Export web bundle
        env:
          # Match e2e-web/web-e2e.js's seeded-session storage key
          # (sb-demo-web-e2e-auth-token derives from this hostname).
          EXPO_PUBLIC_SUPABASE_URL: https://demo-web-e2e.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: demo-anon-key-for-web-e2e
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
        run: npx expo export --platform web --output-dir dist-web

      - name: Serve bundle and run web E2E
        run: |
          node e2e-web/serve-web.js dist-web 8080 &
          SERVER_PID=$!
          # Wait for the static server to accept connections.
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && break
            sleep 1
          done
          node e2e-web/web-e2e.js http://127.0.0.1:8080 ./pw-artifacts
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-screenshots
          path: pw-artifacts/
          if-no-files-found: ignore
